AWSTemplateFormatVersion: '2010-09-09'
Description: Aurora PostgreSQL for ARIA global user roles (users table).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the Aurora cluster (two or more AZs).
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the ARIA application runtime.
  ClusterName:
    Type: String
    Default: aria-users
    AllowedPattern: '[a-z][a-z0-9-]*'
    MaxLength: 40
  DatabaseName:
    Type: String
    Default: aria
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  EngineVersion:
    Type: String
    Default: '17.4'

Resources:
  MasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: ARIA Aurora master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"aria_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ARIA Aurora PostgreSQL; application access only
      VpcId: !Ref VpcId

  DbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroupId
      Description: ARIA server to Aurora PostgreSQL

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: ARIA users database subnets
      SubnetIds: !Ref PrivateSubnetIds

  UsersCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DatabaseName
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      MasterUsername: !Sub '{{resolve:secretsmanager:${MasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${MasterSecret}:SecretString:password}}'
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4
      StorageEncrypted: true
      BackupRetentionPeriod: 7

  UsersClusterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref UsersCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

Outputs:
  ClusterEndpoint:
    Description: Writer endpoint for ARIA_DATABASE_URL
    Value: !GetAtt UsersCluster.Endpoint.Address
  ClusterPort:
    Value: !GetAtt UsersCluster.Endpoint.Port
  DatabaseName:
    Value: !Ref DatabaseName
  MasterSecretArn:
    Description: Retrieve username and password for ARIA_DATABASE_URL
    Value: !Ref MasterSecret
