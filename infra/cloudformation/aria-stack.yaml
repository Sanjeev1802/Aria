AWSTemplateFormatVersion: "2010-09-09"
Description: ARIA — Cognito, Aurora PostgreSQL, ECS Fargate, ALB, ECR, CodePipeline (ap-southeast-1)

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, beta, prod]
    Description: Deployment environment

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for ECS, ALB, and Aurora

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB (minimum 2 AZs)

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for ECS tasks and Aurora (minimum 2 AZs)

  GitHubConnectionArn:
    Type: String
    Default: ""
    Description: CodeStar connection ARN for GitHub (leave empty to skip pipeline)

  GitHubRepository:
    Type: String
    Default: The-Binary-Holdings/Aria

  GitHubBranch:
    Type: String
    Default: Bedrock-deployment

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for HTTPS (leave empty for HTTP-only ALB)

  BedrockApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Amazon Bedrock API key (stored in Secrets Manager)

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Anthropic API key (stored in Secrets Manager)

  PublicWebUrl:
    Type: String
    Default: ""
    Description: Public origin for this environment, such as https://staging.bnii.ai

  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: ENABLED when tasks run in public subnets without a NAT gateway

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasGitHubConnection: !Not [!Equals [!Ref GitHubConnectionArn, ""]]
  IsProd: !Equals [!Ref EnvironmentName, prod]

Resources:
  # ── Cognito ──────────────────────────────────────────────────────────────
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "aria-${EnvironmentName}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "aria-web-${EnvironmentName}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED

  # ── Aurora PostgreSQL ────────────────────────────────────────────────────
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "aria-${EnvironmentName}"
      DBSubnetGroupDescription: !Sub "ARIA ${EnvironmentName} Aurora subnets"
      SubnetIds: !Ref PrivateSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ARIA ${EnvironmentName} Aurora"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub "aria-${EnvironmentName}"
      Engine: aurora-postgresql
      EngineVersion: "15.19"
      DatabaseName: aria
      MasterUsername: aria_app
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !If [IsProd, 1, 0.5]
        MaxCapacity: !If [IsProd, 4, 2]
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "aria/${EnvironmentName}/db-master"
      Description: !Sub "Aurora master credentials for ARIA ${EnvironmentName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "aria_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  DbMasterSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbMasterSecret
      TargetId: !Ref AuroraCluster
      TargetType: AWS::RDS::DBCluster

  # ── Secrets Manager (app) ────────────────────────────────────────────────
  BuildSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "aria/${EnvironmentName}/build"
      Description: !Sub "CodeBuild secrets for ARIA ${EnvironmentName}"
      SecretString: !Sub |
        {
          "NEXT_PUBLIC_COGNITO_REGION": "ap-southeast-1",
          "NEXT_PUBLIC_COGNITO_USER_POOL_ID": "${CognitoUserPool}",
          "NEXT_PUBLIC_COGNITO_CLIENT_ID": "${CognitoUserPoolClient}"
        }

  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "aria/${EnvironmentName}/runtime"
      Description: !Sub "ECS runtime secrets for ARIA ${EnvironmentName}"
      SecretString: !Sub
        - |
          {
            "BEDROCK_API_KEY": "${BedrockKey}",
            "ANTHROPIC_API_KEY": "${AnthropicKey}",
            "ANTHROPIC_MODEL_ID": "claude-sonnet-4-6",
            "NEXT_PUBLIC_COGNITO_USER_POOL_ID": "${CognitoUserPool}",
            "NEXT_PUBLIC_COGNITO_CLIENT_ID": "${CognitoUserPoolClient}"
          }
        - BedrockKey: !Ref BedrockApiKey
          AnthropicKey: !Ref AnthropicApiKey

  # ── ECR ──────────────────────────────────────────────────────────────────
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aria
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 20 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 20
              },
              "action": { "type": "expire" }
            }]
          }

  # ── CloudWatch ───────────────────────────────────────────────────────────
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/aria-${EnvironmentName}"
      RetentionInDays: !If [IsProd, 30, 7]

  # ── IAM ──────────────────────────────────────────────────────────────────
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aria-ecs-execution-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbMasterSecret
                  - !Ref RuntimeSecret
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aria/${EnvironmentName}/*"

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aria-ecs-task-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aria-codebuild-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref BuildSecret
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::aria-pipeline-${EnvironmentName}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::aria-pipeline-${EnvironmentName}-${AWS::AccountId}/*"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubConnection
    Properties:
      RoleName: !Sub "aria-codepipeline-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "${PipelineArtifactsBucket.Arn}"
                  - !Sub "${PipelineArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsExecutionRole.Arn
                  - !GetAtt EcsTaskRole.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn

  # ── Security Groups ──────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ARIA ${EnvironmentName} ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "ARIA ${EnvironmentName} ECS tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ── ALB ──────────────────────────────────────────────────────────────────
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "aria-${EnvironmentName}"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "aria-${EnvironmentName}"
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  # ── ECS ──────────────────────────────────────────────────────────────────
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "aria-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "aria-${EnvironmentName}"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: aria
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aria:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            - Name: BEDROCK_REGION
              Value: ap-southeast-1
            - Name: BEDROCK_MODEL_ID
              Value: apac.amazon.nova-micro-v1:0
            - Name: BEDROCK_ENABLE_SEARCH
              Value: "false"
            - Name: NEXT_PUBLIC_COGNITO_REGION
              Value: ap-southeast-1
            - Name: NEXT_PUBLIC_COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPool
            - Name: NEXT_PUBLIC_COGNITO_CLIENT_ID
              Value: !Ref CognitoUserPoolClient
            - Name: DB_HOST
              Value: !GetAtt AuroraCluster.Endpoint.Address
            - Name: DB_NAME
              Value: aria
            - Name: NEXT_PUBLIC_WEB_URL
              Value: !Ref PublicWebUrl
            - Name: ARIA_PUBLIC_URL
              Value: !Ref PublicWebUrl
            - Name: ANTHROPIC_MODEL_ID
              Value: claude-sonnet-4-6
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub "${DbMasterSecret}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DbMasterSecret}:password::"
            - Name: BEDROCK_API_KEY
              ValueFrom: !Sub "${RuntimeSecret}:BEDROCK_API_KEY::"
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub "${RuntimeSecret}:ANTHROPIC_API_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: aria
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://'+require('os').hostname()+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      ServiceName: aria-web
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref EcsSecurityGroup]
      LoadBalancers:
        - ContainerName: aria
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 120

  # ── CI/CD ────────────────────────────────────────────────────────────────
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: HasGitHubConnection
    Properties:
      BucketName: !Sub "aria-pipeline-${EnvironmentName}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "aria-build-${EnvironmentName}"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ARIA_ENV
            Value: !Ref EnvironmentName
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ARIA_BUILD_SECRET_ID
            Value: !Sub "aria/${EnvironmentName}/build"
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: HasGitHubConnection
    Properties:
      Name: !Sub "aria-${EnvironmentName}"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: ECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref EcsCluster
                ServiceName: aria-web
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildOutput

Outputs:
  EnvironmentName:
    Value: !Ref EnvironmentName

  AlbDnsName:
    Description: Application URL (ALB DNS)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  CognitoUserPoolId:
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Value: !Ref CognitoUserPoolClient

  AuroraEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address

  EcrRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aria"

  EcsClusterName:
    Value: !Ref EcsCluster

  BuildSecretArn:
    Value: !Ref BuildSecret

  RuntimeSecretArn:
    Value: !Ref RuntimeSecret

  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
