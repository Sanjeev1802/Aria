version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-1
    IMAGE_REPO_NAME: aria
    CONTAINER_NAME: aria
    ARIA_BUILD_SECRET_ID: aria-dev

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - BUILD_SECRET=$(aws secretsmanager get-secret-value --secret-id "$ARIA_BUILD_SECRET_ID" --query SecretString --output text)
      - export NEXT_PUBLIC_COGNITO_REGION=$(echo "$BUILD_SECRET" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).NEXT_PUBLIC_COGNITO_REGION||'')")
      - export NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(echo "$BUILD_SECRET" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).NEXT_PUBLIC_COGNITO_USER_POOL_ID||'')")
      - export NEXT_PUBLIC_COGNITO_CLIENT_ID=$(echo "$BUILD_SECRET" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).NEXT_PUBLIC_COGNITO_CLIENT_ID||'')")
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
  build:
    commands:
      - npm ci
      - npx prisma generate
      - npm run typecheck
      - npm run lint
      - docker build
          --build-arg NEXT_PUBLIC_COGNITO_REGION=$NEXT_PUBLIC_COGNITO_REGION
          --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID
          --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID
          -t $REPO_URI:$IMAGE_TAG
          -t $REPO_URI:latest
          .
  post_build:
    commands:
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPO_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
